name: Employee Performance System CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore EmployeePerformanceSystem/Indamin.Performance.Web.csproj
      - name: Build web application
        run: dotnet build EmployeePerformanceSystem/Indamin.Performance.Web.csproj --configuration Release --no-restore
      - name: Restore test project
        run: dotnet restore EmployeePerformanceSystem.Tests/EmployeePerformanceSystem.Tests.csproj
      - name: Run automated tests
        run: dotnet test EmployeePerformanceSystem.Tests/EmployeePerformanceSystem.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"
